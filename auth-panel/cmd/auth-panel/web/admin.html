<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ — Music Server</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 60px auto; padding: 0 20px; background: #f9fafb; }
    h2 { color: #111827; }
    button { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #6b7280; }
    button.secondary:hover { background: #4b5563; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.small { padding: 6px 12px; font-size: 13px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; }
    th { background: #f3f4f6; }
    .link { word-break: break-all; color: #2563eb; font-size: 13px; }
    .error { color: #dc2626; background: #fef2f2; padding: 10px; border-radius: 6px; }
    .success { color: #16a34a; background: #f0fdf4; padding: 10px; border-radius: 6px; }
    .links { margin-top: 24px; font-size: 14px; }
    .links a { color: #2563eb; text-decoration: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header a { color: #dc2626; text-decoration: none; font-size: 14px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #e5e7eb; color: #374151; }
    .badge.admin { background: #dbeafe; color: #1e40af; }
    section { margin-bottom: 40px; }
  </style>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="app-page">
  <div class="app-top header">
    <span id="who"></span>
    <a href="#" onclick="doLogout(); return false;">Выйти</a>
  </div>

  <section>
    <h2>Инвайты</h2>
    <button onclick="createInvite()">Создать ссылку</button>
    <div id="msgInvite" style="margin-top:12px"></div>
    <table><thead><tr><th>Ссылка</th><th>Статус</th><th>Создана</th></tr></thead><tbody id="invites"></tbody></table>
  </section>

  <section>
    <h2>Пользователи</h2>
    <div id="msgUser" style="margin-bottom:12px"></div>
    <table>
      <thead>
        <tr><th>Имя</th><th>Логин</th><th>Роль</th><th>Действия</th></tr>
      </thead>
      <tbody id="users"></tbody>
    </table>
  </section>

  <section>
    <h2>Метаданные музыки</h2>
    <p>Автоматические результаты только для проверки: исходные аудиотеги не меняются.</p>
    <button id="scanMetadataButton" onclick="scanMetadata()">Проверить библиотеку</button>
    <div id="scanMetadataStatus" style="margin:12px 0;color:#4b5563"></div>
    <div id="msgMetadata" style="margin:12px 0"></div>
    <table><thead><tr><th>Файл / исходные данные</th><th>Предложение MusicBrainz</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="metadata"></tbody></table>
  </section>

  <div class="links">
    <a href="/upload">Загрузка музыки</a> &middot;
    <a href="/metube">Скачать с YouTube</a> &middot;
    <a href="{{NavidromeURL}}" target="_blank">Музыкальный сервер</a>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    let currentUser = '';

    async function doLogout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    async function loadMe() {
      try {
        const r = await fetch('/api/me');
        if (r.ok) {
          const j = await r.json();
          currentUser = j.username || '';
          document.getElementById('who').textContent = currentUser;
        }
      } catch (e) {}
    }

    async function loadInvites() {
      const r = await fetch('/api/admin/invites');
      if (!r.ok) { window.location.href = '/login'; return; }
      const items = await r.json();
      const baseUrl = location.origin + '/register?invite=';
      document.getElementById('invites').innerHTML = items.map(i =>
        '<tr><td class="link">' + baseUrl + i.code + '</td><td>' + (i.used ? 'Использована' : 'Активна') + '</td><td>' + new Date(i.created_at).toLocaleDateString('ru') + '</td></tr>'
      ).join('');
    }

    async function createInvite() {
      const msg = document.getElementById('msgInvite');
      try {
        const r = await fetch('/api/admin/invites', { method: 'POST' });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error);
        msg.className = 'success'; msg.textContent = 'Ссылка создана';
        loadInvites();
      } catch (e) {
        msg.className = 'error'; msg.textContent = e.message;
      }
    }

    async function loadUsers() {
      const r = await fetch('/api/admin/users');
      if (!r.ok) { window.location.href = '/login'; return; }
      const items = await r.json();
      const tbody = document.getElementById('users');
      tbody.textContent = '';
      for (const u of items) {
        const tr = document.createElement('tr');
        const name = document.createElement('td'); name.textContent = u.name || u.username;
        const username = document.createElement('td'); username.textContent = u.username;
        const role = document.createElement('td');
        const roleBadge = document.createElement('span');
        roleBadge.className = u.is_admin ? 'badge admin' : 'badge';
        roleBadge.textContent = u.is_admin ? 'Админ' : 'Пользователь';
        role.append(roleBadge);
        const actions = document.createElement('td');
        if (!u.is_main_admin && u.username !== currentUser) {
          const roleBtn = document.createElement('button');
          roleBtn.className = u.is_admin ? 'small secondary' : 'small';
          roleBtn.textContent = u.is_admin ? 'Разжаловать' : 'Сделать админом';
          roleBtn.onclick = () => toggleRole(u.id, !u.is_admin);
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'small danger'; deleteBtn.textContent = 'Удалить';
          deleteBtn.onclick = () => deleteUser(u.id);
          actions.append(roleBtn, document.createTextNode(' '), deleteBtn);
        } else {
          const note = document.createElement('span');
          note.style.cssText = 'color:#9ca3af;font-size:13px';
          note.textContent = u.is_main_admin ? 'Главный админ' : 'Вы';
          actions.append(note);
        }
        tr.append(name, username, role, actions); tbody.append(tr);
      }
    }

    async function toggleRole(id, makeAdmin) {
      const msg = document.getElementById('msgUser');
      try {
        const r = await fetch('/api/admin/users/' + id + '/role', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_admin: makeAdmin }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error);
        msg.className = 'success'; msg.textContent = 'Роль обновлена';
        loadUsers();
      } catch (e) {
        msg.className = 'error'; msg.textContent = e.message;
      }
    }

    async function deleteUser(id) {
      if (!confirm('Удалить пользователя? Это действие нельзя отменить.')) return;
      const msg = document.getElementById('msgUser');
      try {
        const r = await fetch('/api/admin/users/' + id, { method: 'DELETE' });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error);
        msg.className = 'success'; msg.textContent = 'Пользователь удалён';
        loadUsers();
      } catch (e) {
        msg.className = 'error'; msg.textContent = e.message;
      }
    }

    function formatScanTime(value) {
      return value && !value.startsWith('0001-') ? new Date(value).toLocaleString('ru-RU') : 'ещё не запускалась';
    }
    function renderMetadataScanStatus(status) {
      const button = document.getElementById('scanMetadataButton');
      const label = document.getElementById('scanMetadataStatus');
      button.disabled = Boolean(status.running);
      button.textContent = status.running ? 'Проверка идёт…' : 'Проверить библиотеку';
      if (status.running) {
        label.textContent = 'Проверка выполняется с ' + formatScanTime(status.started_at) + '.';
      } else {
        label.textContent = 'Последняя проверка: ' + formatScanTime(status.last_finished_at) + '.';
        if (status.last_error) label.textContent += ' Ошибка: ' + status.last_error;
      }
    }
    async function loadMetadataScanStatus() {
      try {
        const r = await fetch('/api/admin/metadata/scan');
        if (!r.ok) return;
        const status = await r.json();
        renderMetadataScanStatus(status);
        if (status.running) window.setTimeout(loadMetadataScanStatus, 3000);
      } catch (e) {}
    }
    async function scanMetadata() {
      const msg = document.getElementById('msgMetadata');
      const button = document.getElementById('scanMetadataButton');
      button.disabled = true;
      button.textContent = 'Проверка идёт…';
      try {
        const r = await fetch('/api/admin/metadata/scan', {method:'POST'});
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Не удалось запустить проверку');
        msg.className='success'; msg.textContent='Проверка библиотеки запущена.';
        loadMetadataScanStatus();
      } catch (e) {
        msg.className='error'; msg.textContent=e.message || 'Не удалось запустить проверку';
        loadMetadataScanStatus();
      }
    }
    async function loadMetadata() {
      const r = await fetch('/api/admin/metadata');
      if (!r.ok) return;
      const items = await r.json();
      const tbody = document.getElementById('metadata'); tbody.textContent = '';
      for (const m of items) {
        const tr = document.createElement('tr');
        const original = document.createElement('td');
        original.textContent = m.file_path + '\n' + [m.original_artist, m.original_album, m.original_title].filter(Boolean).join(' — ');
        const proposed = document.createElement('td');
        proposed.textContent = [m.suggested_artist, m.suggested_album, m.suggested_title].filter(Boolean).join(' — ') || 'Нет совпадения';
        const state = document.createElement('td'); state.textContent = m.status + (m.confidence ? ' (' + Math.round(m.confidence * 100) + '%)' : '') + (m.last_error ? ': сервис недоступен' : '');
        const actions = document.createElement('td');
        const edit = document.createElement('button'); edit.className='small secondary'; edit.textContent='Править'; edit.onclick=()=>editMetadata(m); actions.append(edit);
        const retry = document.createElement('button'); retry.className='small'; retry.textContent='Повторить'; retry.onclick=()=>reprocessMetadata(m.id); actions.append(document.createTextNode(' ')); actions.append(retry);
        if (m.status === 'review' || m.status === 'manual') {
          const apply = document.createElement('button'); apply.className='small danger'; apply.textContent='Записать теги'; apply.onclick=()=>applyMetadata(m.id); actions.append(document.createTextNode(' ')); actions.append(apply);
        }
        tr.append(original, proposed, state, actions); tbody.append(tr);
      }
    }
    async function editMetadata(m) {
      const title = prompt('Название', m.suggested_title || m.original_title); if (title === null) return;
      const artist = prompt('Исполнитель', m.suggested_artist || m.original_artist); if (artist === null) return;
      const album = prompt('Альбом', m.suggested_album || m.original_album); if (album === null) return;
      const r = await fetch('/api/admin/metadata/' + m.id, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title,artist,album,status:'manual'})});
      const j = await r.json(); if (!r.ok) { document.getElementById('msgMetadata').textContent=j.error; return; } loadMetadata();
    }
    async function reprocessMetadata(id) {
      const r = await fetch('/api/admin/metadata/' + id + '/reprocess', {method:'POST'});
      const j = await r.json(); if (!r.ok) { document.getElementById('msgMetadata').textContent=j.error; return; } loadMetadata();
    }
    async function applyMetadata(id) {
      if (!confirm('Записать отредактированные теги в аудиофайл? Исходный файл будет заменён только после успешной обработки.')) return;
      const r = await fetch('/api/admin/metadata/' + id + '/apply', {method:'POST'});
      const j = await r.json();
      if (!r.ok) { document.getElementById('msgMetadata').className='error'; document.getElementById('msgMetadata').textContent=j.error; return; }
      document.getElementById('msgMetadata').className='success'; document.getElementById('msgMetadata').textContent='Теги записаны'; loadMetadata();
    }

    loadMe().then(() => { loadInvites(); loadUsers(); loadMetadata(); loadMetadataScanStatus(); });
  </script>
</body>
</html>
