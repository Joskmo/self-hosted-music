<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Music Server</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; background: #f9fafb; }
    h2 { color: #111827; }
    input { width: 100%; padding: 10px; margin: 6px 0 16px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 6px; }
    button { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; width: 100%; }
    button:hover { background: #1d4ed8; }
    .error { color: #dc2626; background: #fef2f2; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
    .links { margin-top: 24px; font-size: 14px; }
    .links a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <h2>Вход</h2>
  <div id="msg"></div>
  <form id="form">
    <label>Логин</label>
    <input type="text" name="username" required autocomplete="username">
    <label>Пароль</label>
    <input type="password" name="password" required autocomplete="current-password">
    <button type="submit">Войти</button>
  </form>
  <div class="links">
    <a href="/admin">Админ-панель</a>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const data = Object.fromEntries(new FormData(e.target));
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error);
        window.location.href = '/upload';
      } catch (err) {
        msg.className = 'error';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
