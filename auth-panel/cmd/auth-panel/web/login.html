<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход — Моя музыка</title><link rel="stylesheet" href="/assets/app.css"></head>
<body class="app-page"><header class="app-top"><a class="app-brand" href="/login"><i class="brand-mark">♪</i> Моя музыка</a><nav class="app-nav"><button class="theme-toggle" data-theme-toggle></button></nav></header>
<main class="app-main auth-main"><section class="auth-card"><p class="eyebrow">Локальная коллекция</p><h1 class="page-title">С возвращением</h1><p class="lead">Войди, чтобы загружать музыку, искать треки и управлять библиотекой.</p><div id="msg"></div><form id="form"><label>Логин</label><input type="text" name="username" required autocomplete="username"><label>Пароль</label><input type="password" name="password" required autocomplete="current-password"><button type="submit">Войти</button></form><div class="links"><a href="/admin">Админ-панель</a></div></section></main>
<script src="/assets/app.js"></script><script>document.getElementById('form').addEventListener('submit',async(e)=>{e.preventDefault();const msg=document.getElementById('msg'),data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw new Error(j.error);location.href='/upload'}catch(err){msg.className='error';msg.textContent=err.message}})</script></body></html>
