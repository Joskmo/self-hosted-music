<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Загрузить музыку — Моя музыка</title><link rel="stylesheet" href="/assets/app.css"></head><body class="app-page"><header class="app-top"><a class="app-brand" href="/upload"><i class="brand-mark">♪</i> Моя музыка</a><nav class="app-nav"><a href="/discover">Найти трек</a><a href="/metube">Скачать</a><a class="logout" href="#" onclick="doLogout();return false">Выйти</a><button class="theme-toggle" data-theme-toggle></button></nav></header><main class="workspace"><aside class="workspace-side"><p class="side-label">Коллекция</p><a class="side-link active" href="/upload">↑ Загрузить</a><a class="side-link" href="/discover">⌕ Найти трек</a><a class="side-link" href="/metube">↗ Скачать</a><a class="side-link" href="{{NavidromeURL}}" target="_blank">◉ Слушать</a><a class="side-link" id="adminLink" style="display:none" href="/admin">⊹ Админ</a></aside><section class="workspace-main"><div class="page-head"><div><p class="eyebrow">Локальная библиотека</p><h1 class="page-title">Загрузить музыку</h1><p class="lead">Файлы и ZIP-архивы попадут в общую библиотеку после безопасной обработки.</p></div></div><div id="loginSection" class="panel" style="padding:22px;max-width:420px"><label>Логин</label><input id="username" type="text"><label>Пароль</label><input id="password" type="password"><button onclick="doLogin()">Войти</button></div><div id="uploadSection" style="display:none"><div class="tabs"><button class="tab active" onclick="switchTab('files',this)">Файлы</button><button class="tab" onclick="switchTab('zip',this)">ZIP-архив</button></div><div id="msg"></div><div id="filesTab"><div class="drop-zone" id="dropZone" onclick="fileInput.click()"><input type="file" id="fileInput" multiple accept=".mp3,.flac,.wav,.ogg,.m4a,.aac,.wma,.opus"><div>Перетащи аудиофайлы сюда<br><small>или нажми, чтобы выбрать</small></div></div><div id="fileList"></div><button onclick="uploadFiles()">Загрузить файлы</button></div><div id="zipTab" style="display:none"><div class="drop-zone" onclick="zipInput.click()"><input type="file" id="zipInput" accept=".zip"><div>Выбрать ZIP-архив с музыкой</div></div><button onclick="uploadZip()">Загрузить архив</button></div></div></section></main><script src="/assets/app.js"></script><script>const fileInput=document.getElementById('fileInput'),zipInput=document.getElementById('zipInput');async function checkSession(){try{const r=await fetch('/api/me');if(r.ok){const j=await r.json();loginSection.style.display='none';uploadSection.style.display='block';if(j.is_admin)adminLink.style.display='flex';return}}catch(e){}}async function doLogin(){try{const r=await fetch('/api/upload/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value)}),j=await r.json();if(!r.ok)throw Error(j.error);checkSession()}catch(e){msg.className='error';msg.textContent=e.message}}async function doLogout(){await fetch('/api/logout',{method:'POST'});location='/login'}function switchTab(tab,b){filesTab.style.display=tab==='files'?'block':'none';zipTab.style.display=tab==='zip'?'block':'none';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}fileInput.onchange=()=>fileList.textContent=[...fileInput.files].map(f=>f.name).join(', ');dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('drag')};dropZone.ondrop=e=>{e.preventDefault();fileInput.files=e.dataTransfer.files;dropZone.classList.remove('drag');fileInput.onchange()};async function uploadFiles(){const fd=new FormData();for(const f of fileInput.files)fd.append('files',f);await send('/api/upload',fd)}async function uploadZip(){const fd=new FormData();fd.append('file',zipInput.files[0]);await send('/api/upload/zip',fd)}async function send(url,fd){try{const r=await fetch(url,{method:'POST',body:fd}),j=await r.json();if(!r.ok)throw Error(j.error);msg.className='success';msg.textContent='Готово: '+(j.saved||[]).join(', ')}catch(e){msg.className='error';msg.textContent=e.message}}checkSession()</script></body></html>
