<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — Моя музыка</title><link rel="stylesheet" href="/assets/app.css"></head><body class="app-page"><header class="app-top"><a class="app-brand" href="/login"><i class="brand-mark">♪</i> Моя музыка</a><nav class="app-nav"><button class="theme-toggle" data-theme-toggle></button></nav></header><main class="app-main auth-main"><section class="auth-card"><p class="eyebrow">По приглашению</p><h1 class="page-title">Регистрация</h1><p class="lead">Создай аккаунт для общей музыкальной коллекции.</p><div id="msg"></div><form id="form"><input type="hidden" name="invite" value="{{InviteCode}}"><label>Логин</label><input type="text" name="username" required autocomplete="username"><label>Пароль</label><input type="password" name="password" required minlength="4" autocomplete="new-password"><label>Имя <small>(необязательно)</small></label><input type="text" name="name" autocomplete="name"><button>Зарегистрироваться</button></form><div class="links"><a href="/upload">Загрузить музыку</a><span>·</span><a href="/admin">Админ-панель</a></div></section></main><script src="/assets/app.js"></script><script>document.getElementById('form').addEventListener('submit',async(e)=>{e.preventDefault();const msg=document.getElementById('msg'),data=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw new Error(j.error);location.href='/upload'}catch(err){msg.className='error';msg.textContent=err.message}})</script></body></html>
