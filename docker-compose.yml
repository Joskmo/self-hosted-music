services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`${MINIO_DOMAIN}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.routers.minio.service=minio"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
    networks:
      - web
      - internal

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_MUSIC_USER: ${MINIO_MUSIC_USER}
      MINIO_MUSIC_PASSWORD: ${MINIO_MUSIC_PASSWORD}
      MUSIC_BUCKET_QUOTA: ${MUSIC_BUCKET_QUOTA}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/music
        mc version enable local/music
        mc quota set local/music --size "$$MUSIC_BUCKET_QUOTA"
        cat >/tmp/music-readwrite.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
            "Resource": ["arn:aws:s3:::music"]
          }, {
            "Effect": "Allow",
            "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
            "Resource": ["arn:aws:s3:::music/*"]
          }]
        }
        EOF
        mc admin policy create local music-readwrite /tmp/music-readwrite.json || true
        mc admin user add local "$$MINIO_MUSIC_USER" "$$MINIO_MUSIC_PASSWORD" || true
        mc admin policy attach local music-readwrite --user "$$MINIO_MUSIC_USER"
    networks:
      - internal

  music-sync:
    image: minio/mc:latest
    restart: unless-stopped
    depends_on:
      - minio
      - minio-init
    environment:
      MINIO_MUSIC_USER: ${MINIO_MUSIC_USER}
      MINIO_MUSIC_PASSWORD: ${MINIO_MUSIC_PASSWORD}
    volumes:
      - ./music:/music:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$MINIO_MUSIC_USER" "$$MINIO_MUSIC_PASSWORD"; do sleep 2; done
        until mc mirror --remove --overwrite --retry --checksum SHA256 /music local/music; do sleep 5; done
        exec mc mirror --remove --overwrite --watch --retry --checksum SHA256 /music local/music
    networks:
      - internal

  navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
    volumes:
      - ./data:/data
      - ./music:/music:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome.rule=Host(`${NAVIDROME_DOMAIN}`)"
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      - "traefik.http.routers.navidrome.tls=true"
      - "traefik.http.routers.navidrome.service=navidrome"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
    networks:
      - web
      - internal

  metube:
    image: ghcr.io/alexta69/metube:latest
    restart: unless-stopped
    environment:
      - UID=1000
      - GID=1000
    volumes:
      - ./music:/downloads
    networks:
      - internal

  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - ./auth-db-data:/var/lib/postgresql/data
    networks:
      - internal

  auth-panel:
    build: ./auth-panel
    restart: unless-stopped
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth
      DB_USER: auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_PUBLIC_URL: https://${NAVIDROME_DOMAIN}
      NAVIDROME_ADMIN_USER: ${NAVIDROME_ADMIN_USER}
      NAVIDROME_ADMIN_PASSWORD: ${NAVIDROME_ADMIN_PASSWORD}
      MUSIC_DIR: /music
      METUBE_URL: http://metube:8081
    volumes:
      - ./music:/music
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-panel.rule=Host(`${AUTH_PANEL_DOMAIN}`)"
      - "traefik.http.routers.auth-panel.entrypoints=websecure"
      - "traefik.http.routers.auth-panel.tls=true"
      - "traefik.http.services.auth-panel.loadbalancer.server.port=3000"
    networks:
      - web
      - internal
    depends_on:
      - auth-db

networks:
  web:
    external: true
  internal:
    driver: bridge
