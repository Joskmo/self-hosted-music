services:
  navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
    volumes:
      - ./data:/data
      - ./music:/music:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome.rule=Host(`${NAVIDROME_DOMAIN}`)"
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      - "traefik.http.routers.navidrome.tls=true"
      - "traefik.http.routers.navidrome.service=navidrome"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
    networks:
      - web
      - internal

  youtube-proxy-bridge:
    image: alpine/socat:latest
    restart: unless-stopped
    network_mode: host
    command: TCP-LISTEN:10809,bind=172.18.0.1,reuseaddr,fork TCP:127.0.0.1:10808

  metube:
    image: ghcr.io/alexta69/metube:latest
    restart: unless-stopped
    environment:
      - UID=1000
      - GID=1000
      - YTDL_OPTIONS={"proxy":"http://host.docker.internal:10809"}
      # Required only because the trusted proxy is on the private Docker gateway.
      - ALLOW_PRIVATE_ADDRESSES=true
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./music:/downloads
    networks:
      - internal
    depends_on:
      - youtube-proxy-bridge

  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - ./auth-db-data:/var/lib/postgresql/data
    networks:
      - internal

  auth-panel:
    build: ./auth-panel
    restart: unless-stopped
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth
      DB_USER: auth
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_PUBLIC_URL: https://${NAVIDROME_DOMAIN}
      NAVIDROME_ADMIN_USER: ${NAVIDROME_ADMIN_USER}
      NAVIDROME_ADMIN_PASSWORD: ${NAVIDROME_ADMIN_PASSWORD}
      MUSIC_DIR: /music
      METUBE_URL: http://metube:8081
    volumes:
      - ./music:/music
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-panel.rule=Host(`${AUTH_PANEL_DOMAIN}`)"
      - "traefik.http.routers.auth-panel.entrypoints=websecure"
      - "traefik.http.routers.auth-panel.tls=true"
      - "traefik.http.services.auth-panel.loadbalancer.server.port=3000"
    networks:
      - web
      - internal
    depends_on:
      - auth-db

networks:
  web:
    external: true
  internal:
    driver: bridge
